name: Manual macOS build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.21.0'
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Build without answer or course tests
        run: pnpm build:release
      - name: Package desktop and userscript separately
        run: pnpm release:pack
      - uses: actions/upload-artifact@v4
        with:
          name: ocs-rust-macos-${{ runner.arch }}
          path: dist/release/**/*
          if-no-files-found: error
